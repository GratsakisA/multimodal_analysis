[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-analysis"
version = "0.1.0"
author = [
{name = "Anastasios Gratsakis", email = "gratsakisanastasios@gmail.com"}
]
description = "Behavioral experiment analysis of multimodal tasks"
readme = "README.md"
# license = {text="MIT"}

keywords = ["neuroscience", "audiovisual", "multimodal", "behavior", "data-analysis", "visualization", "ethopy"]


dependencies = [
    "datajoint>=0.13.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "numpy>=1.21.0",
]

[tool.setuptools.package-dir]
where = ["src"]