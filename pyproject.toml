[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-analysis"
version = "0.1.0"
requires-python = ">=3.11"
authors = [
{name = "Anastasios Gratsakis", email = "gratsakisanastasios@gmail.com"}
]
description = "Behavioral experiment analysis of multimodal tasks"
readme = "README.md"
# license = {text="MIT"}

keywords = [
    "neuroscience", 
    "audiovisual", 
    "multimodal", 
    "behavior", 
    "data-analysis", 
    "visualization", 
    "ethopy"
]

dependencies = [
    "datajoint>=0.14.0,<2.0.0",
    "matplotlib>=3.4.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy",
    "seaborn>=0.11.0",
]

[project.optional-dependencies]
tasks = [
    "ethopy",
]


[tool.setuptools.packages.find]
where = ["src"]